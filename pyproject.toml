[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crashtest"
version = "0.1.0"
description = "Deterministic reward-integrity test kit for Harbor tasks: scripted cheats + the task's own grader, no LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maksym Nedashkivskyi" }]
keywords = ["harbor", "terminal-bench", "reward-hacking", "benchmark", "rl-environments", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Harbor is the harness crashtest drives. It is an optional dependency so the
# package (result model, cheat registry, fixture harness, scorecard) imports and
# the self-test suite runs with no Harbor and no network. Install this extra on a
# machine where you actually run scans.
harbor = ["harbor"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
crashtest = "crashtest.cli:main"

[project.urls]
Homepage = "https://github.com/MNedashkivskyi/crashtest"
Issues = "https://github.com/MNedashkivskyi/crashtest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crashtest"]

# Cheat scripts and fixtures ship with the wheel so `crashtest` works installed.
[tool.hatch.build.targets.wheel.force-include]
"src/crashtest/cheats" = "crashtest/cheats"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# crashtest's OWN test suite must never autoload a plugin or pick up a stray
# conftest from a fixture tree. The fixture harness copies fixtures into an
# isolated tmpdir before running them, but belt and braces:
addopts = "-p no:cacheprovider"
